<app-loader *ngIf="isDataLoading"></app-loader>

<form class="recipe-form">

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>שם</mat-label>
        <input matInput type="text" [(ngModel)]="name" [ngModelOptions]="{ standalone: true }">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>תיאור</mat-label>
        <textarea matInput cdkTextareaAutosize [(ngModel)]="description"
            [ngModelOptions]="{ standalone: true }"></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>קטגוריה</mat-label>
        <mat-select [(ngModel)]="selectedCategory" [ngModelOptions]="{ standalone: true }" dir="rtl">
            <mat-option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-radio-group [(ngModel)]="type" [ngModelOptions]="{ standalone: true }" class="type-group" color="primary">
        <mat-radio-button *ngFor="let option of typeOptions" [value]="option">{{ option }}</mat-radio-button>
    </mat-radio-group>

    <div class="methods-group">
        <button mat-button type="button" class="method-pill" *ngFor="let option of methodOptions"
            [class.selected]="isMethodSelected(option)" (click)="toggleMethod(option)">
            <span>{{ option }}</span>
        </button>
    </div>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>זמן הכנה בדקות</mat-label>
        <input matInput type="number" [(ngModel)]="time" [ngModelOptions]="{ standalone: true }">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>רמת קושי (1-5)</mat-label>
        <input matInput type="number" [(ngModel)]="difficulty" [ngModelOptions]="{ standalone: true }">
    </mat-form-field>

    <label class="section-label">שכבות:</label>
    <div *ngFor="let layer of layers; let i = index" class="layer">
        <mat-form-field appearance="fill" class="half-width">
            <mat-label>מרכיבים</mat-label>
            <textarea matInput cdkTextareaAutosize [value]="layer.ingredients"
                (input)="updateLayer(i, 'ingredients', $event)"></textarea>
        </mat-form-field>
        <mat-form-field appearance="fill" class="half-width">
            <mat-label>תיאור</mat-label>
            <textarea matInput cdkTextareaAutosize [value]="layer.description"
                (input)="updateLayer(i, 'description', $event)"></textarea>
        </mat-form-field>
        <button mat-icon-button color="warn" type="button" (click)="removeLayer(i)" *ngIf="layers.length > 1">
            <mat-icon>remove</mat-icon>
        </button>
    </div>
    <button mat-icon-button color="primary" type="button" (click)="addLayer()" aria-label="הוסף שכבה">
        <mat-icon>add</mat-icon>
    </button>

    <!--
    <label>תמונה</label><br />
    <input type="file" accept="image/*" (change)="onImageSelected($event)" #fileInput />
    <div *ngIf="imagePreview">
        <img [src]="imagePreview" alt="תצוגה מקדימה" width="200" /><br />
        <button type="button" (click)="removeImage(fileInput)">הסר תמונה</button>
    </div><br />
-->

    <label class="section-label">הוראות הכנה:</label>
    <div class="instruction-row" *ngFor="let instruction of instructions; let i = index; trackBy: trackByIndex">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>שלב {{ i + 1 }}</mat-label>
            <textarea matInput cdkTextareaAutosize [(ngModel)]="instructions[i]" [ngModelOptions]="{ standalone: true }"
                name="instruction{{i}}"></textarea>
        </mat-form-field>

        <button mat-icon-button color="warn" type="button" (click)="removeInstruction(i)"
            *ngIf="instructions.length > 1">
            <mat-icon>remove</mat-icon>
        </button>
    </div>
    <button mat-icon-button color="primary" type="button" (click)="addInstruction()" aria-label="הוסף הוראה">
        <mat-icon>add</mat-icon>
    </button>


    <label class="section-label">האם פרטי?</label>
    <mat-radio-group [(ngModel)]="isPrivate" [ngModelOptions]="{ standalone: true }" color="primary">
        <mat-radio-button [value]="false">לא</mat-radio-button>
        <mat-radio-button [value]="true">כן</mat-radio-button>
    </mat-radio-group>

    <!-- Action Buttons -->
    <mat-card-actions>
        <div class="recipe-actions">
            <button mat-raised-button color="primary" class="action-button" (click)="addRecipe()">שמירה</button>
            <button mat-raised-button color="warn" class="action-button" type="button" *ngIf="!isEditMode" (click)="resetForm()">איפוס</button>
        </div>
    </mat-card-actions>


</form>
