<div class="filters">
    <mat-form-field appearance="fill" class="full-width">
        <mat-label>חיפוש</mat-label>
        <input matInput type="text" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>קטגוריה</mat-label>
        <mat-select [(ngModel)]="selectedCategory" (selectionChange)="filterRecipes()" [ngModelOptions]="{ standalone: true }" dir="rtl">
            <mat-option [value]="''">כל הקטגוריות</mat-option>
            <mat-option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
        <mat-label>זמן מקסימלי בדקות</mat-label>
        <input matInput type="number" [(ngModel)]="maxTimeInput" (input)="onMaxTimeChange()" />
    </mat-form-field>
</div>

<div class="recipes-page">
  <app-loader *ngIf="isDataLoading"></app-loader>

  <div *ngIf="filteredRecipes.length > 0; else noResults" class="cards-container">
    <mat-card *ngFor="let res of filteredRecipes" class="recipe-card" [routerLink]="['/recipe', res._id]">
        <div class="card-image-container">
            <img *ngIf="res.image" class="recipe-image" [src]="res.image" alt="תמונה של {{res.name}}" />
            <div *ngIf="!res.image" class="recipe-image-placeholder">🍳</div>
        </div>
        <mat-card-content class="card-content">
            <mat-card-title class="recipe-title">{{ res.name }}</mat-card-title>
            <div class="recipe-details">
                <div class="detail-row">
                    <span class="detail-label">📂</span>
                    <span class="detail-value">{{ res.category.name }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🏷️</span>
                    <span class="detail-value">{{ res.type }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">⏱️</span>
                    <span class="detail-value">{{ res.time | duration }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">👤</span>
                    <span class="detail-value">{{ res.user.username }}</span>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>

<ng-template #noResults>
    <div class="no-results">
        <p *ngIf="error">{{ error }}</p>
    </div>
</ng-template>
